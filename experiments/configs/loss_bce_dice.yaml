name: loss_bce_dice
seed: 42
dataset_dir: dataset

model:
  use_channel_attention: true
  use_residual: true
  use_multiscale: true

training:
  epochs: 150
  batch_size: 4
  lr: 0.001
  weight_decay: 0.0001
  patience: 40
  accumulation_steps: 4
  device: cpu
  loss: bce_dice         # plain BCE + Dice without pos_weight/fn_penalty
  scheduler: cosine_warm

preprocessing:
  use_clahe: true
  use_gamma: true
  gamma: 1.2
  clahe_clip: 2.0
  input_size: 512

evaluation:
  threshold: 0.5
  # 若权重在云同步目录，可显式指定（不设则自动尝试 experiments/results 与 results/experiments/results）
  # checkpoint: results/experiments/results/loss_bce_dice/best_model.pth

notes: "Ablation: Loss changed to BCE+Dice (no pos_weight/fn_penalty vs Combo)"
